backend:
  name: github
  repo: gauharbaltabaeva40-netizen/new-portfolio
  branch: main
  site_domain: bekzat-kz.vercel.app

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "projects"
    label: "Жұмыстар"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Жоба атауы", name: "title", widget: "string" }
      - { label: "Сипаттамасы", name: "description", widget: "string" }
      - { label: "Санаты", name: "category", widget: "string" }
      - { label: "Сурет", name: "image", widget: "image" }
